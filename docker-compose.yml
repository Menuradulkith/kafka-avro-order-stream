services:
  broker:
    image: confluentinc/cp-kafka:7.6.0
    hostname: broker
    container_name: os-broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://broker:29092,CONTROLLER://broker:29093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: LOo12SGCScOj0Pj3WKVGUg
    healthcheck:
      test: ["CMD", "bash", "-c", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10

  registry:
    image: confluentinc/cp-schema-registry:7.6.0
    hostname: registry
    container_name: os-registry
    depends_on:
      broker:
        condition: service_healthy
    ports:
      - "8091:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://broker:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 10s
      timeout: 10s
      retries: 10

  topics-bootstrap:
    image: confluentinc/cp-kafka:7.6.0
    container_name: os-topics-bootstrap
    depends_on:
      broker:
        condition: service_healthy
    entrypoint: ["bash", "-c"]
    command: >
      "
      kafka-topics --bootstrap-server broker:29092 --create --if-not-exists --topic order-events --partitions 3 --replication-factor 1 &&
      kafka-topics --bootstrap-server broker:29092 --create --if-not-exists --topic order-events.deadletter --partitions 1 --replication-factor 1 &&
      echo 'topics ready'
      "

  console:
    image: provectuslabs/kafka-ui:latest
    container_name: os-console
    depends_on:
      - broker
      - registry
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: order-stream
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: broker:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://registry:8081
